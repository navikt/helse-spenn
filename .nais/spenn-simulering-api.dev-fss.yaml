spec:
  ingresses:
    - https://spenn-simulering-api.dev-fss-pub.nais.io
  replicas:
    min: 1
    max: 1
  accessPolicy:
    inbound:
      rules:
        - application: spenn-simulering
          cluster: dev-gcp
  env:
