spec:
  liveness:
    initialDelay: 5
  readiness:
    initialDelay: 5
  resources:
    limits:
      memory: 512Mi
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-f1-micro
        pointInTimeRecovery: true
        name: spenn-avstemming
        databases:
          - name: spenn-avstemming
            envVarPrefix: DATABASE
  accessPolicy:
    outbound:
      external:
        - host: b27apvl220.preprod.local
          ports:
            - port: 1413
  env:
    - name: MQ_HOSTNAME
      value: b27apvl220.preprod.local
    - name: MQ_CHANNEL
      value: Q1_SPENN
    - name: MQ_PORT
      value: "1413"
    - name: MQ_QUEUE_MANAGER
      value: MQLS02
    - name: MQ_OPPDRAG_AUTHENTICATION
      value: "true"
    - name: AVSTEMMING_QUEUE_SEND
      # Setter target client = 1 for bakoverkompabilitet med stormaskin
      value: queue:///QA.Q2_234.OB29_AVSTEMMING_XML?targetClient=1
