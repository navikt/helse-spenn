spec:
  liveness:
    initialDelay: 5
  readiness:
    initialDelay: 5
  replicas:
    cpuThresholdPercentage: 90
    max: 1
    min: 1
  resources:
    limits:
      memory: 512Mi
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-f1-micro
        name: spenn
        databases:
          - name: spenn
            envVarPrefix: DATABASE
            users:
              - name: spenn-opprydding
