spec:
  liveness:
    initialDelay: 10
  readiness:
    initialDelay: 10
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 4096Mi
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-custom-1-3840
        name: spenn-avstemming
        databases:
          - name: spenn-avstemming
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "true"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  accessPolicy:
    outbound:
      external:
        - host: mpls02.adeo.no
          ports:
            - port: 1414
  env:
    - name: MQ_HOSTNAME
      value: mpls02.adeo.no
    - name: MQ_CHANNEL
      value: P_SPENN
    - name: MQ_PORT
      value: "1414"
    - name: MQ_QUEUE_MANAGER
      value: MPLS02
    - name: AVSTEMMING_QUEUE_SEND
      # Setter target client = 1 for bakoverkompabilitet med stormaskin
      value: queue:///QA.P234.OB29_AVSTEMMING_XML?targetClient=1
