spec:
  liveness:
    initialDelay: 5
  readiness:
    initialDelay: 5
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
  kafka:
    pool: nav-dev
  accessPolicy:
    outbound:
      external:
        - host: b27apvl220.preprod.local
          ports:
            - port: 1413
  env:
    - name: MQ_HOSTNAME
      value: b27apvl220.preprod.local
    - name: MQ_CHANNEL
      value: Q1_SPENN
    - name: MQ_PORT
      value: "1413"
    - name: MQ_QUEUE_MANAGER
      value: MQLS02
    - name: OPPDRAG_QUEUE_SEND
      value: QA.Q2_231.OB04_OPPDRAG_XML
    - name: OPPDRAG_QUEUE_MOTTAK
      value: QA.Q1_SPENN.OPPDRAG_SP_XML_KVITT
    - name: MQ_OPPDRAG_AUTHENTICATION
      value: "true"
