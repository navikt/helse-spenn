spec:
  liveness:
    initialDelay: 10
  readiness:
    initialDelay: 10
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 64Mi
  kafka:
    pool: nav-prod
  accessPolicy:
    outbound:
      external:
        - host: mpls02.adeo.no
          ports:
            - port: 1414
  env:
    - name: KAFKA_RESET_POLICY
      value: none
    - name: MQ_HOSTNAME
      value: mpls02.adeo.no
    - name: MQ_CHANNEL
      value: P_SPENN
    - name: MQ_PORT
      value: "1414"
    - name: MQ_QUEUE_MANAGER
      value: MPLS02
    - name: OPPDRAG_QUEUE_SEND
      value: QA.P231.OB04_OPPDRAG_XML
    - name: OPPDRAG_QUEUE_MOTTAK
      value: QA.P_SPENN.OPPDRAG_SP_XML_KVITT
