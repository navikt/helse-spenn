spec:
  liveness:
    initialDelay: 10
  readiness:
    initialDelay: 10
  preStopHook:
    http:
      path: /stop
  replicas:
    max: 6
    min: 2
    scalingStrategy:
      kafka:
        topic: tbd.rapid.v1
        consumerGroup: tbd-spenn-v1
        threshold: 200
  resources:
    limits:
      memory: 1024Mi
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-custom-1-3840
        name: spenn
        databases:
          - name: spenn
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "true"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: KAFKA_RESET_POLICY
      value: none
