apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: tbd
  name: spenn-avstemming
  namespace: tbd
spec:
  port: 8080
  strategy:
    type: Recreate
  liveness:
    path: /isalive
  readiness:
    path: /isready
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    cpuThresholdPercentage: 90
    max: 1
    min: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  envFrom:
    - secret: spenn
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spenn-avstemming-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_RESET_POLICY
      value: latest
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
