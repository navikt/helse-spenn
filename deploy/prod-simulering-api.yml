apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: tbd
  name: spenn-simulering-api
  namespace: tbd
spec:
  port: 8080
  strategy:
    type: RollingUpdate
  liveness:
    initialDelay: 5
    path: /isalive
  readiness:
    initialDelay: 5
    path: /isready
    periodSeconds: 1
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  prometheus:
    enabled: true
    path: /metrics
  azure:
    application:
      enabled: true
  ingresses:
    - https://spenn-simulering-api.prod-fss-pub.nais.io
  replicas:
    min: 2
    max: 2
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  accessPolicy:
    inbound:
      rules:
        - application: spenn-simulering
          cluster: prod-gcp
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  webproxy: true
  env:
    - name: JDK_JAVA_OPTIONS
      value: $(JAVA_PROXY_OPTIONS)
    - name: SIMULERING_SERVICE_URL
      value: https://wasapp.adeo.no/cics/services/simulerFpServiceWSBinding
    - name: GANDALF_BASE_URL
      value: https://security-token-service.nais.adeo.no
